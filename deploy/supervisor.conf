; Keeps the queue workers and the page renderer running. deploy/setup-ec2.sh installs this file.
[program:namtech-queue]
process_name=%(program_name)s_%(process_num)02d
command=php __ROOT__/backend/artisan queue:work database --queue=mail,media,default --sleep=3 --tries=3 --max-time=3600
numprocs=2
user=www-data
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/var/log/supervisor/namtech-queue.log
redirect_stderr=true

[program:namtech-ssr]
command=php __ROOT__/backend/artisan inertia:start-ssr
directory=__ROOT__/backend
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/namtech-ssr.log
redirect_stderr=true
